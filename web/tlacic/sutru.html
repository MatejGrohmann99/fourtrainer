<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cross Edge Trainer</title>

    <style>
        body{
            margin:0;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#111;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
        }

        #container{
            text-align:center;
            padding:30px 20px;
        }

        /* ── Menu ── */
        #menu{
            display:flex;
            justify-content:center;
            gap:12px;
            margin-bottom:28px;
        }

        .menu-btn{
            background:#1a1a1a;
            border:1px solid #333;
            border-radius:10px;
            color:#aaa;
            font-size:14px;
            font-weight:600;
            padding:10px 20px;
            cursor:pointer;
            transition:background 0.15s, color 0.15s, border-color 0.15s;
            white-space:nowrap;
        }

        .menu-btn:hover{
            background:#252525;
            color:#ddd;
        }

        .menu-btn.active{
            background:#2a2a2a;
            border-color:#666;
            color:#fff;
        }

        .menu-count{
            opacity:0.45;
            font-weight:400;
        }

        /* ── Logo ── */
        #logo{
            margin-bottom:24px;
        }

        #logo img{
            width:28vw;
            object-fit:contain;
        }

        /* ── Counters ── */
        #counters{
            display:flex;
            justify-content:center;
            gap:40px;
            margin-bottom:28px;
        }

        .counter-box{
            background:#1e1e1e;
            border:1px solid #333;
            border-radius:12px;
            padding:12px 28px;
        }

        .counter-label{
            font-size:11px;
            text-transform:uppercase;
            letter-spacing:1.5px;
            opacity:0.45;
            margin-bottom:4px;
        }

        .counter-value{
            font-size:28px;
            font-weight:700;
            color:#e0e0e0;
        }

        /* ── Scramble ── */
        #scramble{
            font-size:32px;
            line-height:1.4;
            max-width:900px;
            word-wrap:break-word;
        }

        #hint{
            margin-top:30px;
            font-size:16px;
            opacity:0.6;
        }

        #headline {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #fff;
    opacity: 0.85;
    margin-bottom: 28px;
}
    </style>
</head>

<body>

<div id="container">

    <div id="headline">Tlačič šutru 3000</div>

    <div id="menu">
        <button class="menu-btn" data-size="4" onclick="selectSize(4)">4x4x4 <span class="menu-count" id="count-label-4">(0)</span></button>
        <button class="menu-btn" data-size="5" onclick="selectSize(5)">5x5x5 <span class="menu-count" id="count-label-5">(0)</span></button>
        <button class="menu-btn" data-size="6" onclick="selectSize(6)">6x6x6 <span class="menu-count" id="count-label-6">(0)</span></button>
        <button class="menu-btn active" data-size="7" onclick="selectSize(7)">7x7x7 <span class="menu-count" id="count-label-7">(0)</span></button>
    </div>

    <div id="logo">
        <img src="img.png" alt="Logo">
    </div>

    <div id="counters">
        <div class="counter-box">
            <div class="counter-label">Session</div>
            <div class="counter-value" id="session-count">0</div>
        </div>
        <div class="counter-box">
            <div class="counter-label">All Time</div>
            <div class="counter-value" id="alltime-count">0</div>
        </div>
    </div>

    <div id="scramble"></div>
    <div id="hint">Press SPACE for new scramble</div>

</div>

<script>

    /* ── Slice moves per cube size ── */
    const SLICE_MOVES = {
        4: ["Rw"],
        5: ["Rw","Lw"],
        6: ["Rw","3Rw","Lw","3Lw"],
        7: ["Rw","3Rw","Lw","3Lw"]
    };

    const cubeMoves = ["U","D","F","R","B","L"];
    const modifiers = ["","'","2"];

    function mod(){
        return modifiers[Math.floor(Math.random() * modifiers.length)];
    }

    function randomInt(min, max){
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

  function sliceSection(sliceMoves){

    let length = randomInt(3, 6);
    let used   = new Set();
    let result = [];
    let cap    = Math.min(length, sliceMoves.length);

    while(result.length < cap){

        let move = sliceMoves[Math.floor(Math.random() * sliceMoves.length)];

        if(!used.has(move)){
            used.add(move);
            result.push(move + mod());
        }
    }

    // If bigger cube (more slice types), insert random U/D move
    if(sliceMoves.length > 1){

        const inserts = ["U2", "D2"];
        const insertMove = inserts[Math.floor(Math.random() * inserts.length)];

        const position = Math.floor(Math.random() * (result.length + 1));

        result.splice(position, 0, insertMove);
    }

    return result;
   }


function cubeSection(){
    let length   = randomInt(3, 6);
    let result   = [];
    let lastMove = null;
    while(result.length < length){
        let move = cubeMoves[Math.floor(Math.random() * cubeMoves.length)];
        if(move === lastMove){
            continue;
        }
        if((move === "U" || move === "D") && (lastMove === "U" || lastMove === "D")){
            continue;
        }
        if((move === "R" || move === "L") && (lastMove === "R" || lastMove === "L")){
            continue;
        }
        if((move === "F" || move === "B") && (lastMove === "F" || lastMove === "B")){
            continue;
        }
        result.push(move + mod());
        lastMove = move;
    }
    return result;
}

    function generateScramble(size){
        let sliceMoves = SLICE_MOVES[size];
        let scramble   = ["U2","D2","L", "U'", "D"];
        let useSlice   = true;
        while(scramble.length < 23){
            let section = useSlice ? sliceSection(sliceMoves) : cubeSection();
            scramble.push(...section);
            useSlice = !useSlice;
        }
        return scramble.join(" ");
    }

    /* ── Storage helpers ── */
    function alltimeKey(size){ return `ce_alltime_${size}`; }

    /* ── State ── */
    let currentSize = 7;

    const sessionCounts = { 4: 0, 5: 0, 6: 0, 7: 0 };

    const alltimeCounts = {
        4: parseInt(localStorage.getItem(alltimeKey(4)) || "0", 10),
        5: parseInt(localStorage.getItem(alltimeKey(5)) || "0", 10),
        6: parseInt(localStorage.getItem(alltimeKey(6)) || "0", 10),
        7: parseInt(localStorage.getItem(alltimeKey(7)) || "0", 10),
    };

    /* ── UI ── */
    function updateCounterUI(){
        document.getElementById("session-count").textContent = sessionCounts[currentSize];
        document.getElementById("alltime-count").textContent = alltimeCounts[currentSize];
    }

    function updateMenuLabels(){
        [4, 5, 6, 7].forEach(size => {
            document.getElementById(`count-label-${size}`).textContent =
                `(${alltimeCounts[size]})`;
        });
    }

    function updateActiveBtn(){
        document.querySelectorAll(".menu-btn").forEach(btn => {
            btn.classList.toggle("active", parseInt(btn.dataset.size) === currentSize);
        });
    }

    function newScramble(){
        document.getElementById("scramble").textContent = generateScramble(currentSize);
    }

    /* ── Size selection ── */
    function selectSize(size){
        currentSize = size;
        updateActiveBtn();
        updateCounterUI();
        newScramble();
    }

    /* ── Spacebar ── */
    document.addEventListener("keydown", function(e){
        if(e.code === "Space"){
            e.preventDefault();
            sessionCounts[currentSize]++;
            alltimeCounts[currentSize]++;
            localStorage.setItem(alltimeKey(currentSize), alltimeCounts[currentSize]);
            updateCounterUI();
            updateMenuLabels();
            newScramble();
        }
    });

    /* ── Init ── */
    updateMenuLabels();
    updateCounterUI();
    updateActiveBtn();
    newScramble();

</script>

</body>
</html>
